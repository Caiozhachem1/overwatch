<style>
:root{--bg:#F5F5F0;--ink:#0A0A0A;--muted:#76766F;--red:#C8362E;--green:#1D7A6A;--lz-b:#6E6E68;--lz-c:#A8A8A1;--lz-h:#E2E2DA}
@media (prefers-color-scheme:dark){:root{--bg:#1B1C1E;--ink:#F4F4F4;--muted:#8A8A86;--red:#E0493F;--green:#3BA48F;--lz-b:#C4C4C4;--lz-c:#828282;--lz-h:#000}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;display:grid;place-items:center;padding:0 16px}
main{max-width:380px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.lz-icon .a,.lz-word .a{fill:currentColor}.lz-icon .b{fill:var(--lz-b)}.lz-icon .c{fill:var(--lz-c)}.lz-icon .r{fill:#FF2400}.lz-icon .h{fill:var(--lz-h)}
.lz{display:flex;align-items:center;gap:14px;color:var(--ink)}.lz-icon{width:44px;height:44px}.lz-word{height:22px;width:auto}
.prod{font:500 12px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
p{margin:0;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:7px;animation:p 1.2s ease-in-out infinite}
.off .dot{background:var(--red);animation:none}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
a{color:var(--green)}

<script>
// Permanent entry point for Lazarus Overwatch: forwards to wherever the server currently runs (url.json, kept
// up to date by the server). Anything after "#" (e.g. "#/invite/<token>") becomes the path and never reaches GitHub.
(async function () {
  const FALLBACK = "https://circus-division-emma-patio.trycloudflare.com";
  const s = document.getElementById('s');
  async function current() {
    try {
      const r = await fetch('https://api.github.com/repos/Caiozhachem1/overwatch/contents/url.json?ref=main', {headers: {Accept: 'application/vnd.github.raw+json'}, cache: 'no-store'});
      if (r.ok) { const j = await r.json(); if (j.url) return j.url; }
    } catch (e) {}
    try { const r = await fetch('url.json?t=' + Date.now(), {cache: 'no-store'}); if (r.ok) { const j = await r.json(); if (j.url) return j.url; } } catch (e) {}
    return FALLBACK;
  }
  const base = (await current()).replace(/\/$/, '');
  let path = location.hash.startsWith('#/') ? location.hash.slice(1) : '/';
  if (!/^\/(invite|reset|magic|embed|login|account|admin)?([\/?].*)?$/.test(path)) path = '/';
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
    await fetch(base + '/healthz', {mode: 'no-cors', signal: ctl.signal, cache: 'no-store'});
    location.replace(base + path);
  } catch (e) {
    document.getElementById('m').className = 'off';
    s.innerHTML = '<span class="dot"></span>Overwatch is offline right now. It usually comes back within a few minutes. <a href="">Try again</a>';
  }
})();
</script>
